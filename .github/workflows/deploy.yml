name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Fix base paths for GitHub Pages
        working-directory: frontend
        run: |
          sed -i 's|src="/assets/|src="/Jumu-AI/assets/|g' dist/index.html
          sed -i 's|href="/assets/|href="/Jumu-AI/assets/|g' dist/index.html
          sed -i 's|href="/manifest.json"|href="/Jumu-AI/manifest.json"|g' dist/index.html
          sed -i "s|navigator.serviceWorker\.register('/sw.js')|navigator.serviceWorker.register('/Jumu-AI/sw.js')|g" dist/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
